aid: datumate
name: Datumate
description: >-
  Datumate is a construction technology company whose cloud-native SaaS platform,
  DatuBIM, turns drone imagery, laser-scanning, and site data into real-time
  progress tracking, deviation detection, automated reporting, and actionable
  analytics for heavy civil infrastructure projects. It serves asset owners,
  general contractors, and engineering and consulting firms across roads,
  highways, rail, bridges, and earthworks, giving multi-site visibility from
  design validation through construction to final inspection. The company reports
  125+ active customers, thousands of managed sites, and tens of thousands of
  processed drone flights. Datumate has Israeli engineering roots (Technion) with
  leadership based in Miami, Florida, and is backed by Battery Ventures.
